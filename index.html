<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大连客户成功服务交接进度汇报看板</title>
<style>
  :root{
    --blue:#1f5c99; --blue-d:#174a7c; --blue2:#2e75b6;
    --orange:#ed7d31; --orange-d:#d96a1f;
    --green:#70ad47; --green-t:#4e7a2c;
    --amber:#d99000; --red:#c0392b;
    --ink:#262626; --sub:#666; --muted:#8fa3b8;
    --bg:#f2f7fc; --card:#fff;
    --line:#cce5ff; --line2:#e3eef9;
    --blue-soft:#e9f1f8; --blue2-soft:#e8f1fa;
    --green-soft:#edf6e7; --orange-soft:#fdf0e7; --amber-soft:#fff6dc; --purple-soft:#f1edfb;
    --shadow:0 1px 2px rgba(31,92,153,.06),0 10px 28px rgba(31,92,153,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  svg{display:block;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;}
  .topbar{background:linear-gradient(120deg,#174a7c,#1f5c99 45%,#2e75b6);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(23,74,124,.28);}
  .topbar-inner{max-width:1080px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:16px;}
  .kd-logo{height:34px;width:auto;display:block;flex-shrink:0;}
  .brand-div{width:1px;height:32px;background:rgba(255,255,255,.3);flex-shrink:0;}
  .brand .sub{font-size:12px;color:#bcd7ef;letter-spacing:.5px;}
  .brand h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:.3px;line-height:1.3;}
  .spacer{flex:1;}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .btn svg{width:16px;height:16px;}
  .btn-accent{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(237,125,49,.35);}
  .btn-accent:hover{background:var(--orange-d);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-d);}
  .wrap{max-width:1080px;margin:0 auto;padding:8px 24px 56px;}
  /* list */
  .list-head{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 2px 18px;}
  .list-head h2{font-size:21px;font-weight:800;color:var(--blue-d);}
  .year-sel-wrap{display:inline-flex;align-items:center;gap:8px;}
  .year-sel-label{font-size:13px;color:var(--muted);font-weight:700;}
  .year-sel{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--blue-d);background:#fff;outline:none;cursor:pointer;font-family:inherit;}
  .year-sel:focus{border-color:var(--blue2);}
  .year-sel .add-year-opt{color:var(--blue2);font-weight:800;}
  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;}
  .proj-card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:20px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .proj-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--blue2));opacity:0;transition:.18s;}
  .proj-card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 14px 34px rgba(31,92,153,.16);}
  .proj-card:hover::before{opacity:1;}
  .pc-top{display:flex;align-items:center;justify-content:space-between;}
  .pc-icon{width:42px;height:42px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;}
  .pc-icon svg{width:22px;height:22px;}
  .pc-name{font-size:16px;font-weight:700;margin:14px 0 12px;line-height:1.4;}
  .pc-meta{display:flex;gap:14px;font-size:12.5px;color:var(--sub);flex-wrap:wrap;}
  .pc-meta span{display:inline-flex;align-items:center;gap:5px;}
  .pc-meta svg{width:15px;height:15px;color:var(--blue2);}
  .pc-meta i{font-style:normal;}
  .pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:12.5px;gap:8px;}
  .pc-count{color:var(--muted);}
  .pc-go{color:var(--blue2);font-weight:700;display:inline-flex;align-items:center;gap:3px;}
  .pc-go svg{width:15px;height:15px;}
  .pc-prog{color:var(--blue2);font-weight:800;background:var(--blue2-soft);padding:2px 11px;border-radius:12px;border:1px solid var(--line);white-space:nowrap;}
  .status-badge{font-size:11px;padding:3px 11px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:700;white-space:nowrap;}
  .status-badge.已签收{background:var(--green-soft);color:var(--green-t);}
  .status-badge.暂停{background:var(--orange-soft);color:var(--orange-d);}
  .overdue-dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 3px rgba(192,57,43,.18);}
  .empty{color:var(--muted);font-size:14px;padding:26px 0;text-align:center;}
  /* progress bar */
  .pbar{height:7px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:10px;}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:5px;}
  .pbar.hot > i{background:linear-gradient(90deg,#d96a1f,var(--orange));}
  .pbar.ok > i{background:linear-gradient(90deg,var(--green),#8bc34a);}
  /* detail */
  .back-btn{background:none;border:none;color:var(--blue2);font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 0;margin:8px 2px 12px;font-weight:600;}
  .back-btn svg{width:17px;height:17px;}
  .back-btn:hover{color:var(--blue-d);}
  .detail-head{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
  .dh-icon{width:44px;height:44px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dh-icon svg{width:23px;height:23px;}
  .dh-text{flex:1;min-width:0;}
  .proj-name{font-size:20px;font-weight:800;border:none;outline:none;background:transparent;color:var(--ink);width:100%;border-bottom:2px solid transparent;padding:2px 0;}
  .proj-name:focus{border-bottom-color:var(--blue2);}
  .del-proj{background:none;border:1px solid var(--line2);color:var(--muted);font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;}
  .del-proj:hover{border-color:var(--orange);color:var(--orange-d);}
  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .info-item{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;}
  .info-item.full{grid-column:1/-1;}
  .info-item label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:5px;}
  .info-item label svg{width:14px;height:14px;color:var(--blue2);}
  .info-item input,.info-item select{width:100%;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;color:var(--ink);background:#f7fafd;}
  .info-item input:focus,.info-item select:focus{border-color:var(--blue2);background:#fff;}
  .info-ro{font-size:13.5px;font-weight:800;color:var(--blue-d);padding:7px 10px;background:#f7fafd;border:1px solid var(--line2);border-radius:7px;}
  /* section blocks */
  .block{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--line);}
  .block-head h3{font-size:16px;font-weight:800;color:var(--blue-d);display:flex;align-items:center;gap:9px;}
  .block-head h3 .sec-ic{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
  .block-head h3 .sec-ic svg{width:16px;height:16px;}
  .btn-sm{padding:7px 13px;font-size:12.5px;}
  .btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--sub);border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:700;}
  .btn-ghost:hover{border-color:var(--muted);}
  .btn-ghost.btn-sm{background:#fff;padding:7px 13px;font-size:12.5px;}
  /* workflow stages */
  .wf-stage{border:1px solid var(--line2);border-radius:11px;padding:12px 14px;margin-bottom:11px;transition:.15s;background:#fff;}
  .wf-stage.done{border-color:var(--green);background:var(--green-soft);}
  .wf-head{display:flex;align-items:center;gap:11px;}
  .wf-num{width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wf-stage.done .wf-num{background:var(--green);}
  .wf-label{font-size:14px;font-weight:800;color:var(--blue-d);flex:1;}
  .wf-done-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;background:#f7fafd;border:1px solid var(--line2);border-radius:20px;padding:5px 12px;}
  .wf-done-toggle input{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}
  .wf-stage.done .wf-done-toggle{color:var(--green-t);border-color:var(--green);background:#fff;}
  .wf-note-wrap{margin-top:10px;}
  .wf-note-wrap label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  .wf-note{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none;resize:vertical;color:var(--ink);background:#f7fafd;}
  .wf-note:focus{border-color:var(--blue2);background:#fff;}
  .wf-records{margin-top:11px;border-top:1px dashed var(--line2);padding-top:10px;}
  .entry-add{background:#fff;border:1px solid var(--line);color:var(--blue2);border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:700;transition:.15s;}
  .entry-add:hover{background:var(--blue-soft);border-color:var(--blue2);}
  .rec-table{width:100%;border-collapse:collapse;margin-top:2px;font-size:13px;background:#fff;border:1px solid var(--line2);border-radius:9px;overflow:hidden;}
  .rec-table th,.rec-table td{border-bottom:1px solid var(--line2);padding:7px 9px;text-align:left;vertical-align:middle;}
  .rec-table th{background:var(--blue-soft);color:var(--blue-d);font-weight:700;font-size:12px;white-space:nowrap;}
  .rec-table tr:last-child td{border-bottom:none;}
  .rec-table input[type=text],.rec-table input[type=date]{width:100%;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;outline:none;background:#f7fafd;box-sizing:border-box;}
  .rec-table input:focus{border-color:var(--blue2);background:#fff;}
  .rec-table select{width:100%;border:1px solid var(--line2);border-radius:7px;padding:6px 6px;font-size:12.5px;font-family:inherit;outline:none;background:#f7fafd;box-sizing:border-box;}
  .rec-table select:focus{border-color:var(--blue2);background:#fff;}
  .rec-table .col-date{width:135px;}
  .rec-table .col-form{width:118px;}
  .rec-table .col-del{width:42px;text-align:center;}
  .rec-table .rec-done-cell{text-align:center;white-space:nowrap;}
  .rec-table .rec-done-cell input{accent-color:var(--green);width:16px;height:16px;cursor:pointer;}
  .rec-table .rec-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
  .rec-table .rec-del:hover{color:var(--orange-d);}
  .rec-table .empty-cell{color:var(--muted);font-size:13px;padding:11px 9px;text-align:center;}
  .wf-items{margin-top:11px;border-top:1px dashed var(--line2);padding-top:6px;}
  .wf-group-title{font-size:12.5px;font-weight:800;color:var(--blue2);margin:8px 0 2px;}
  .wf-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line2);}
  .wf-item:last-child{border-bottom:none;}
  .cl-check{width:18px;height:18px;margin-top:2px;flex-shrink:0;cursor:pointer;accent-color:var(--green);}
  .cl-text{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font-size:13.5px;font-family:inherit;outline:none;color:var(--ink);width:100%;}
  .cl-text:focus{background:#fff;border-color:var(--line);}
  .cl-text.done{text-decoration:line-through;color:var(--muted);}
  .cl-req{font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--amber-soft);color:var(--amber);white-space:nowrap;margin-left:6px;}
  .cl-req.opt{background:var(--blue-soft);color:var(--blue);}
  .cl-del{background:none;border:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;flex-shrink:0;}
  .cl-del:hover{color:var(--orange-d);}
  .cl-add{background:none;border:1px dashed var(--line);color:var(--blue2);font-size:12px;padding:4px 12px;border-radius:8px;cursor:pointer;margin-top:6px;font-weight:600;transition:.15s;}
  .cl-add:hover{background:var(--blue-soft);color:var(--blue);border-color:var(--blue2);}
  /* risks */
  .risk-item{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;background:#f7fafd;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;}
  .risk-idx{font-size:12px;font-weight:800;color:var(--orange-d);flex-shrink:0;margin-top:2px;}
  .risk-item textarea{flex:1;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;font-family:inherit;outline:none;resize:vertical;color:var(--ink);}
  .risk-item textarea:focus{background:#fff;border-color:var(--line);}
  .risk-del{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:0 2px;flex-shrink:0;}
  .risk-del:hover{color:var(--orange-d);}
  /* risks continued / shared */
  .row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .empty2{color:var(--muted);font-size:14px;padding:14px 0;}
  .big-note{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.6;font-family:inherit;color:var(--ink);background:#f7fafd;outline:none;transition:border-color .15s,background .15s;box-sizing:border-box;}
  .big-note:focus{border-color:var(--blue2);background:#fff;}
  .big-note::placeholder{color:var(--muted);}
  .modal-mask{position:fixed;inset:0;background:rgba(23,50,80,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-mask[hidden]{display:none;}
  .modal{background:#fff;border-radius:14px;padding:24px 24px 20px;width:min(440px,100%);box-shadow:0 22px 60px rgba(23,50,80,.3);}
  .modal-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px;color:var(--blue-d);}
  .modal-title svg{width:20px;height:20px;color:var(--blue2);}
  .modal label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:7px;}
  .modal input{width:100%;border:1px solid var(--line2);border-radius:9px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;background:#f7fafd;}
  .modal input:focus{border-color:var(--blue2);background:#fff;}
  .modal-err{color:var(--orange-d);font-size:12px;margin-top:8px;min-height:14px;font-weight:600;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  @media(max-width:720px){.info-grid{grid-template-columns:1fr;}.topbar-inner{flex-wrap:wrap;}}
</style>
</head>

  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>',

};
let state=load();
let view='list';
let currentYear=String(new Date().getFullYear());
let activeId=state.handovers[0]?state.handovers[0].id:null;

const main=document.getElementById('main');
const hModal=document.getElementById('hModal');
const hNameInput=document.getElementById('hNameInput');
const hErr=document.getElementById('hErr');

document.getElementById('addBtn').addEventListener('click',()=>{hErr.textContent='';hNameInput.value='';hModal.hidden=false;setTimeout(()=>hNameInput.focus(),50);});
document.getElementById('hCancel').addEventListener('click',()=>{hModal.hidden=true;});
document.getElementById('hCreate').addEventListener('click',createHandover);
hNameInput.addEventListener('keydown',e=>{if(e.key==='Enter')createHandover();});
hModal.addEventListener('click',e=>{if(e.target===hModal)hModal.hidden=true;});
const yModal=document.getElementById('yModal');
const yInput=document.getElementById('yInput');
const yErr=document.getElementById('yErr');
document.getElementById('yCancel').addEventListener('click',()=>{yModal.hidden=true;render();});
document.getElementById('yCreate').addEventListener('click',createYear);
yInput.addEventListener('keydown',e=>{if(e.key==='Enter')createYear();});
yModal.addEventListener('click',e=>{if(e.target===yModal){yModal.hidden=true;render();}});
const excelInput=document.getElementById('excelInput');
excelInput.addEventListener('change',handleExcel);

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clamp(v,min,max){v=Number(v)||0;return Math.max(min==null?0:min,Math.min(max==null?100:max,v));}
function getH(id){return state.handovers.find(x=>x.id===id);}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
function load(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.handovers&&d.handovers.length)return d;}catch(e){}return seed();}
function stage(h,key){return (h.workflow||[]).find(x=>x.key===key);}

function defaultWorkflow(){
  return WORKFLOW.map(w=>({key:w.key,label:w.label,done:false,note:'',records:[],items:[]}));
}
function createHandover(){
  const name=hNameInput.value.trim();
  if(!name){hErr.textContent='请填写交接项目名称';return;}
  const h={id:uid(),name:name,year:currentYear,transferor:'',transferee:'',scope:'',planStart:'',planEnd:'',status:'未开始',kbLink:'',workflow:defaultWorkflow(),risks:[],reports:[]};
  state.handovers.push(h);activeId=h.id;view='detail';hModal.hidden=true;save();render();
}
function openYearModal(){
  yErr.textContent='';yInput.value='';yModal.hidden=false;setTimeout(()=>yInput.focus(),50);
}
function createYear(){
  const y=String(yInput.value||'').trim();
  if(!/^\d{4}$/.test(y)){yErr.textContent='请输入四位年份，如 2027';return;}
  if(Number(y)<2000||Number(y)>2100){yErr.textContent='年份需在 2000 ~ 2100 之间';return;}
  state.extraYears=state.extraYears||[];
  if(!state.extraYears.includes(y))state.extraYears.push(y);
  currentYear=y;yModal.hidden=true;save();render();
}

/* ---------- helpers: workflow progress ---------- */
function workflowStats(h){
  const wf=h.workflow||[];
  let done=0;wf.forEach(s=>{if(s.done)done++;});
  return {done,total:wf.length};
}
function signoffDone(h){const wf=h.workflow||[];const last=wf[wf.length-1];return !!(last&&last.done);}
function isOverdue(h){
  if(h.status==='已签收')return false;
  if(!h.planEnd)return false;
  if(signoffDone(h))return false;
  return h.planEnd<today();
}

/* ---------- list view ---------- */
function render(){if(view==='detail'&&getH(activeId))renderDetail();else renderList();}
function allYears(){
  const s=new Set((state.handovers||[]).map(p=>p.year||String(new Date().getFullYear())));
  s.add(currentYear);(state.extraYears||[]).forEach(y=>s.add(y));
  return [...s].sort((a,b)=>String(b).localeCompare(String(a)));
}
function renderList(){
  const years=allYears();
  const list=state.handovers.filter(p=>(p.year||String(new Date().getFullYear()))===currentYear);
  let h='';
  h+='<div class="list-head"><div><h2>交接项目列表</h2></div><div class="year-sel-wrap"><span class="year-sel-label">年度</span><select class="year-sel" id="yearFilter">';
  years.forEach(yr=>{h+='<option value="'+esc(yr)+'"'+(yr===currentYear?' selected':'')+'>'+esc(yr)+' 年</option>';});
  h+='<option value="__add_year__" class="add-year-opt">＋ 新增年度…</option>';
  h+='</select></div></div>';

  const shown=list;

  if(shown.length===0){h+='<div class="empty">该年度下暂无交接项目。点击右上角「+ 新增交接项目」创建。</div>';main.innerHTML=h;return;}
  h+='<div class="proj-grid">';
  shown.forEach(p=>{
    const od=isOverdue(p);
    const ws=workflowStats(p);
    const prog=clamp(p.progress);
    const pbarCls=signoffDone(p)?' ok':(od?' hot':'');
    h+='<div class="proj-card" data-pid="'+p.id+'">';
    h+='<div class="pc-top"><span class="pc-icon">'+ICON.folder+'</span></div>';
    h+='<div class="pc-name">'+esc(p.name)+'</div>';
    h+='<div class="pc-meta"><span>'+ICON.owner+'<i>'+esc(p.transferor||'未指定')+' → '+esc(p.transferee||'未指定')+'</i></span></div>';
    h+='<div class="pc-meta"><span>'+ICON.cal+'<i>'+(p.planStart?(p.planStart+(p.planEnd?' ~ '+p.planEnd:'')):'未排期')+'</i></span>'+(od?'<span><span class="overdue-dot"></span> 逾期</span>':'')+'</div>';
    h+='<div class="pbar'+pbarCls+'"><i style="width:'+prog+'%"></i></div>';
    h+='<div class="pc-foot"><span class="pc-count">流程 '+ws.done+'/'+ws.total+'</span><span class="pc-prog">'+prog+'%</span><span class="pc-go">进入 '+ICON.chevron+'</span></div>';
    h+='</div>';
  });
  h+='</div>';
  main.innerHTML=h;
}

/* ---------- detail view ---------- */

  r+=infoField(ICON.cal,'计划结束','planEnd',h.planEnd,'input',h.id);

  h.workflow.forEach((s,i)=>{
    const done=s.done?' done':'';
    r+='<div class="wf-stage'+done+'">';
    r+='<div class="wf-head"><div class="wf-num">'+(i+1)+'</div><div class="wf-label">'+esc(s.label)+'</div><label class="wf-done-toggle"><input type="checkbox" data-action="toggle-stage" data-project="'+h.id+'" data-stage="'+s.key+'"'+(s.done?' checked':'')+'> 已完成</label></div>';
    r+='<div class="wf-note-wrap"><label>补充说明</label><textarea class="wf-note" data-action="stage-note" data-project="'+h.id+'" data-stage="'+s.key+'" rows="2" placeholder="本阶段完成情况、遗留问题、注意事项…">'+esc(s.note||'')+'</textarea></div>';
    if(s.key==='product')r+=renderProductRecords(h.id,s);
    if(s.key==='spec')r+='<div class="wf-items">'+renderSpecItems(h.id,s)+'</div>';
    r+='</div>';
  });
  r+='</div>';

  /* risks block */
  r+='<div class="block"><div class="block-head"><h3><span class="sec-ic" style="background:var(--orange-soft);color:var(--orange)">'+ICON.alert+'</span>交接项目可预见风险</h3><button class="btn btn-ghost btn-sm" data-action="add-risk" data-project="'+h.id+'">+ 添加风险</button></div>';
  if(!h.risks||!h.risks.length)r+='<div class="empty2">暂无已登记的风险。建议填写：时间风险、知识盲区、二开代码质量、账号 / 权限移交等。</div>';
  (h.risks||[]).forEach((rsk,i)=>{
    r+='<div class="risk-item"><span class="risk-idx">'+(i+1)+'</span><textarea data-action="risk-field" data-field="text" data-project="'+h.id+'" data-rid="'+rsk.id+'" rows="2" placeholder="风险描述 + 应对建议…">'+esc(rsk.text||'')+'</textarea><button class="risk-del" data-action="del-risk" data-project="'+h.id+'" data-rid="'+rsk.id+'" title="删除">×</button></div>';
  });
  r+='</div>';

  /* 下一步工作计划 */
  r+='<div class="block"><div class="block-head"><h3><span class="sec-ic" style="background:var(--blue2-soft);color:var(--blue2)">'+ICON.arrow+'</span>下一步工作计划</h3></div>';
  r+='<textarea class="big-note" data-field="nextPlan" data-project="'+h.id+'" rows="3" placeholder="后续交接排期、待办事项、负责人与时间节点…">'+esc(h.nextPlan||'')+'</textarea>';
  r+='</div>';

  /* 其他备注事项 */
  r+='<div class="block"><div class="block-head"><h3><span class="sec-ic" style="background:var(--amber-soft);color:var(--amber)">'+ICON.star+'</span>其他备注事项</h3></div>';
  r+='<textarea class="big-note" data-field="notes" data-project="'+h.id+'" rows="3" placeholder="其他需要说明的情况、遗留问题、补充材料等…">'+esc(h.notes||'')+'</textarea>';
  r+='</div>';

  main.innerHTML=r;
}
function recFormOptions(val){
  const opts=FORM_OPTIONS.slice();
  if(val&&!opts.includes(val))opts.push(val);
  return opts.map(o=>'<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('');
}
function renderProductRecords(pid,s){
  let h='<div class="wf-records"><div class="row-inline" style="margin-bottom:8px;justify-content:space-between"><span style="font-size:12.5px;color:var(--muted);font-weight:700">交接情况记录（可分多次填写）</span><button class="entry-add" data-action="add-record" data-project="'+pid+'" data-stage="'+s.key+'">+ 添加交接记录</button></div>';
  if(!s.records||!s.records.length){
    h+='<table class="rec-table"><thead><tr><th class="col-date">交接日期</th><th>交接内容</th><th>移交人 / 接收人</th><th class="col-form">交接形式</th><th>是否完成</th><th class="col-del">操作</th></tr></thead><tbody><tr><td class="empty-cell" colspan="6">尚未记录具体交接情况。点击「+ 添加交接记录」开始填写。</td></tr></tbody></table>';
  }else{
    h+='<table class="rec-table"><thead><tr><th class="col-date">交接日期</th><th>交接内容</th><th>移交人 / 接收人</th><th class="col-form">交接形式</th><th>是否完成</th><th class="col-del">操作</th></tr></thead><tbody>';
    (s.records||[]).forEach(rec=>{
      h+='<tr>';
      h+='<td><input type="date" data-action="rec-field" data-field="time" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'" value="'+esc(rec.time||'')+'"></td>';
      h+='<td><input type="text" data-action="rec-field" data-field="situation" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'" value="'+esc(rec.situation||'')+'" placeholder="如：完成 XXX 模块演示、环境确认…"></td>';
      h+='<td><input type="text" data-action="rec-field" data-field="person" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'" value="'+esc(rec.person||'')+'" placeholder="移交人 / 接收人"></td>';
      h+='<td><select data-action="rec-field" data-field="form" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'">'+recFormOptions(rec.form)+'</select></td>';
      h+='<td class="rec-done-cell"><input type="checkbox" data-action="rec-done" data-field="done" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'"'+(rec.done?' checked':'')+'></td>';
      h+='<td class="col-del"><button class="rec-del" data-action="del-record" data-project="'+pid+'" data-stage="'+s.key+'" data-rid="'+rec.rid+'" title="删除">×</button></td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  return h;

function renderSpecItems(pid,s){
  if(!s.items||!s.items.length)return '<div class="empty2">本阶段暂无交接规范清单，可点「+ 添加清单项」手动补充。</div>';
  const groups={};
  s.items.forEach(it=>{const g=it.group||'其他';(groups[g]=groups[g]||[]).push(it);});
  let h='';
  Object.keys(groups).forEach(g=>{
    h+='<div class="wf-group-title">'+esc(g)+'</div>';
    groups[g].forEach(it=>{
      const reqCls=(it.required&&it.required.indexOf('否')>=0)?' opt':'';
      const reqHtml=it.required?'<span class="cl-req'+reqCls+'">'+(it.required.indexOf('否')>=0?'选填':'必填')+'</span>':'';
      h+='<div class="wf-item"><input type="checkbox" class="cl-check" data-action="spec-toggle" data-project="'+pid+'" data-item="'+it.id+'"'+(it.done?' checked':'')+'>';
      h+='<input class="cl-text'+(it.done?' done':'')+'" data-action="spec-item-text" data-project="'+pid+'" data-item="'+it.id+'" value="'+esc(it.text)+'">'+reqHtml+'<button class="cl-del" data-action="del-spec-item" data-project="'+pid+'" data-item="'+it.id+'" title="删除">×</button></div>';
    });
  });
  h+='<button class="cl-add" data-action="add-spec-item" data-project="'+pid+'">+ 添加清单项</button>';
  return h;
}
function infoField(icon,label,field,val,type,pid,opts){
  const v=esc(val==null?'':val);
  let fh='';
  if(type==='textarea')fh='<textarea data-field="'+field+'" data-project="'+pid+'" rows="2">'+v+'</textarea>';
  else if(type==='select'){
    fh='<select data-field="'+field+'" data-project="'+pid+'">';
    (opts||[]).forEach(o=>{fh+='<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>';});
    fh+='</select>';
  }else if(type==='number')fh='<input type="number" min="0" max="100" step="1" data-field="'+field+'" data-project="'+pid+'" value="'+v+'">';
  else fh='<input data-field="'+field+'" data-project="'+pid+'" value="'+v+'">';
  return '<div class="info-item"><label>'+icon+label+'</label>'+fh+'</div>';
}

/* ---------- events ---------- */
main.addEventListener('input',e=>{
  const t=e.target;
  const pid=t.dataset.project;if(!pid)return;
  const h=getH(pid);if(!h)return;
  const a=t.dataset.action;
  if(a==='stage-note'){const s=stage(h,t.dataset.stage);if(s)s.note=t.value;save();return;}
  if(a==='rec-field'){const s=stage(h,t.dataset.stage);const rec=(s.records||[]).find(x=>x.rid===t.dataset.rid);if(rec)rec[t.dataset.field]=t.value;save();return;}
  if(a==='risk-field'){const r=(h.risks||[]).find(x=>x.id===t.dataset.rid);if(r)r.text=t.value;save();return;}
  if(a==='spec-item-text'){const s=stage(h,'spec');const it=(s.items||[]).find(x=>x.id===t.dataset.item);if(it){it.text=t.value;if(it.done){const inp=main.querySelector('input.cl-text[data-item="'+it.id+'"]');if(inp)inp.classList.add('done');}}save();return;}
  const f=t.dataset.field;if(!f)return;
  if(f==='name')h.name=t.value;
  else if(f==='progress')h.progress=clamp(t.value);
  else h[f]=t.value;
  save();
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='yearFilter'){
    if(t.value==='__add_year__'){openYearModal();return;}
    currentYear=t.value;render();return;
  }
  const pid=t.dataset&&t.dataset.project;if(!pid)return;
  const h=getH(pid);if(!h)return;
  if(t.dataset.action==='rec-field'){const s=stage(h,t.dataset.stage);const rec=(s.records||[]).find(x=>x.rid===t.dataset.rid);if(rec)rec[t.dataset.field]=t.value;save();return;}
  if(t.dataset.action==='rec-done'){const s=stage(h,t.dataset.stage);const rec=(s.records||[]).find(x=>x.rid===t.dataset.rid);if(rec)rec.done=t.checked;save();return;}
  if(t.dataset.action==='toggle-stage'){
    const s=stage(h,t.dataset.stage);
    if(s){s.done=t.checked;if(s.key==='signoff'&&s.done&&h.status!=='已签收')h.status='已签收';}
    save();renderDetail();return;
  }
  if(t.dataset.action==='spec-toggle'){
    const s=stage(h,'spec');const it=(s.items||[]).find(x=>x.id===t.dataset.item);
    if(it){it.done=t.checked;const inp=main.querySelector('input.cl-text[data-item="'+it.id+'"]');if(inp)inp.classList.toggle('done',it.done);}
    save();renderDetail();return;
  }
  if(t.dataset.action==='status'){h.status=t.value;save();renderDetail();return;}
});
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  const card=e.target.closest('[data-pid]');
  if(card&&!b){activeId=card.dataset.pid;view='detail';render();return;}
  if(!b)return;
  const a=b.dataset.action,pid=b.dataset.project;
  const h=getH(pid);
  if(a==='back'){view='list';render();return;}
  if(!h)return;
  if(a==='del-handover'){if(confirm('确认删除该交接项目及其所有流程、风险记录？此操作不可撤销。')){state.handovers=state.handovers.filter(x=>x.id!==pid);if(activeId===pid)activeId=state.handovers[0]?state.handovers[0].id:null;view='list';save();render();}return;}
  if(a==='add-record'){const s=stage(h,b.dataset.stage);s.records=s.records||[];s.records.push({rid:uid(),time:today(),situation:'',person:'',form:'现场会议',done:false});save();renderDetail();return;}
  if(a==='del-record'){const s=stage(h,b.dataset.stage);s.records=(s.records||[]).filter(x=>x.rid!==b.dataset.rid);save();renderDetail();return;}
  if(a==='add-risk'){(h.risks=h.risks||[]).push({id:uid(),text:''});save();renderDetail();return;}
  if(a==='del-risk'){h.risks=(h.risks||[]).filter(x=>x.id!==b.dataset.rid);save();renderDetail();return;}
  if(a==='add-spec-item'){const s=stage(h,'spec');(s.items=s.items||[]).push({id:uid(),text:'',group:'补充项',done:false,required:''});save();renderDetail();return;}
  if(a==='del-spec-item'){const s=stage(h,'spec');s.items=(s.items||[]).filter(x=>x.id!==b.dataset.item);save();renderDetail();return;}
});

/* ---------- excel import ---------- */
function handleExcel(){
  const file=this.files[0];if(!file)return;
  if(typeof XLSX==='undefined'){alert('Excel 解析组件未加载（需要联网加载 xlsx 库）。请联网后重试，或手动新增交接项。');this.value='';return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
      const res=parseHandoverExcel(wb);
      if(!res||!res.groups.length){alert('未在该文件中识别到「客户成功服务交接总表」的标准结构。\n请确认导入的是交接规范表（含 第一部分~第四部分 检查清单）。');return;}
      const wf=defaultWorkflow();
      const specItems=[];
      res.groups.forEach(g=>g.items.forEach(it=>specItems.push({id:it.id,text:it.text,group:g.title,done:false,required:it.required||''})));
      const specStage=stage({workflow:wf},'spec');
      if(specStage)specStage.items=specItems;
      let name=res.meta.name||('导入交接项-'+today());
      const h={id:uid(),name:name,year:currentYear,transferor:res.meta.transferor||'',transferee:res.meta.transferee||'',scope:'',planStart:res.meta.date||'',planEnd:'',status:'进行中',kbLink:'',workflow:wf,risks:[],reports:[]};
      state.handovers.push(h);activeId=h.id;view='detail';save();render();
      alert('已导入「'+name+'」：生成 1 个交接项，第 1 阶段「交接规范清单交接」已载入 '+specItems.length+' 项标准清单（共 '+res.groups.length+' 组）。');
    }catch(err){alert('Excel 解析失败：'+(err&&err.message?err.message:err));}
  };
  reader.readAsArrayBuffer(file);
  this.value='';
}
function parseHandoverExcel(wb){
  let ws=null;
  for(const n of wb.SheetNames){if(n.indexOf('交接总表')>=0||n.indexOf('交接清单')>=0){ws=wb.Sheets[n];break;}}
  if(!ws&&wb.SheetNames.length)ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws)return null;
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,cellDates:true});
  const meta={name:'',transferor:'',transferee:'',date:''};
  const gv=(r,c)=>String((rows[r]&&rows[r][c])||'').trim();
  const clean=v=>(v&&v.indexOf('[')<0&&v.indexOf('请填写')<0&&v.indexOf('YYYY')<0)?v:'';
  let rName=-1,rCSM=-1,rDate=-1;
  rows.forEach((r,i)=>{
    const b=String(r[0]||'');
    if(rName<0&&b.indexOf('客户名称')>=0)rName=i;
    if(rCSM<0&&b.indexOf('接收CSM')>=0)rCSM=i;
    if(rDate<0&&b.indexOf('交接日期')>=0)rDate=i;
  });
  if(rName>=0){meta.name=clean(gv(rName,1));meta.transferor=clean(gv(rName,3));}
  if(rCSM>=0){const a=clean(gv(rCSM,1)),b=clean(gv(rCSM,3));meta.transferee=a+(b&&b!==a?('/'+b):'');}
  if(rDate>=0)meta.date=clean(gv(rDate,1));
  const groups=[];let cur=null;
  const partRe=/第[一二三四五六七八九十]+部分[:：]/;
  rows.forEach(r=>{
    const b=String(r[0]||'').trim();
    if(!b)return;
    const m=b.match(partRe);
    if(m){cur={title:b.replace(partRe,'').trim()||b,items:[]};groups.push(cur);return;}
    if(cur){
      if(b==='检查项')return;
      const desc=String(r[1]||'').trim();
      const req=String(r[2]||'').trim();
      const note=String(r[3]||'').trim();
      if(b && !partRe.test(b)){
        cur.items.push({id:uid(),text:b,desc:desc,note:note,required:req,done:false});
      }
    }
  });
  return {meta,groups:groups.filter(g=>g.items.length)};
}
